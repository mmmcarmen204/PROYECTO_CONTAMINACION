
name: 'calidad_aire_granada'
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"


# VARIABLES =====================================================
vars:
  provincia_proyecto: 18      # Granada (código INE de provincia)
    # 41 Sevilla, 29 Málaga, 23 Jaen, 21 Huelva, 18 Granada, 14 Córdoba, 11 Cádiz, 4 Almería
  anios_proyecto: [2012, 2016, 2020, 2024]        # Años utilizados para el proyectos.


#===================================================================
# MODELOS
#===================================================================
models:
  calidad_aire_granada:

    # SILVER ------------------------------------------------------- 
    staging:
      +materialized: view
      +database: "{{ env_var('DBT_SILVER') }}"
      +schema: STAGING

    silver:
      +materialized: view
      +database: "{{ env_var('DBT_SILVER') }}"
      +schema: SILVER

    # GOLD -----------------------------------------------------------
    marts:
      +materialized: table
      +database: "{{ env_var('DBT_GOLD') }}"
      +schema: MARTS


#===================================================================
# SEEDS
#===================================================================
seeds:
  calidad_aire_granada:
    +database: "{{ env_var('DBT_BRONZE') }}"
    +schema: seeds


#===================================================================
# SNAPSHOTS
#===================================================================

#snapshots:
# +transient: false
# +database: "{{ env_var('DBT_SILVER') }}"
# +schema: snapshots
