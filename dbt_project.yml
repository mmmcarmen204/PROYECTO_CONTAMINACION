
name: 'calidad_aire_granada'
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"


# VARIABLES =====================================================
vars:
  provincia: 18   # Granada (código INE de provincia)


#===================================================================
# MODELOS
#===================================================================
models:
  calidad_aire_granada:

    # BRONZE -------------------------------------------------------
    
    bronze:
      +materialized: view
      +database: "{{ env_var('DBT_BRONZE') }}"
      +schema: BRONZE

    # SILVER ------------------------------------------------------- 
    staging:
      +materialized: view
      +database: "{{ env_var('DBT_SILVER') }}"
      +schema: STAGING

    silver:
      +materialized: view
      +database: "{{ env_var('DBT_SILVER') }}"
      +schema: SILVER

    # GOLD -----------------------------------------------------------
    marts:
      +materialized: table
      +database: "{{ env_var('DBT_GOLD') }}"
      +schema: MARTS


#===================================================================
# SEEDS
#===================================================================
seeds:
  calidad_aire_granada:
  +database: "{{ env_var('DBT_BRONZE') }}"
  +schema: seeds


#===================================================================
# SNAPSHOTS
#===================================================================
snapshots:
 +transient: false
 +target_database: 
 +target_schema: snapshots
